# Pulse configuration. Pulse creates config.yaml with these defaults on first start;
# most settings can be changed in the dashboard instead of editing this file.
server:
    host: 127.0.0.1          # keep on 127.0.0.1; Meta reaches only the webhook through your tunnel
    port: 8085
    api_key: ""               # create one in Settings > Integrations
    admin_password: ""        # left empty: a one-time password is generated on first start
    operator_password: ""
    must_change_password: true
    allowed_hosts: []         # extra host names allowed in the Host header (reverse proxy)
    trusted_proxies: []       # CIDRs whose X-Forwarded-For header is trusted
# Your own WhatsApp Business Platform (Cloud API) details. Enter them in
# Settings > WhatsApp connection rather than here: the access token and app secret are
# then stored sealed with your Windows account. A value typed here is sealed at the next start.
cloud_api:
    phone_number_id: ""       # Meta: WhatsApp > API Setup (digits, not your phone number)
    business_account_id: ""   # WhatsApp Business account ID (digits)
    access_token: ""          # permanent system-user token; stored sealed
    app_secret: ""            # Meta: App settings > Basic; checks incoming webhooks; stored sealed
    verify_token: ""          # created by Pulse; paste it in Meta's webhook settings
    api_version: v23.0
    public_url: ""            # https address of your tunnel, e.g. https://example.trycloudflare.com
storage:
    data_dir: ""              # empty: %APPDATA%\Pulse on Windows
    encrypt: true
    retention_days: 180       # 0 keeps messages until deleted
    max_messages: 50000
business:
    name: ""
    hours: ""
    address: ""
    website: ""
    email: ""
    services: ""
    prices: ""
automation:
    enabled: false            # switch on from the dashboard after the setup checklist
    pace: careful             # careful | balanced | fast | custom
    require_opt_in: true
    enforce_24h_window: true
    allow_list_only: false
    allow_list: []
    dry_run: false
webhook:                      # events sent to your own other systems (optional)
    enabled: false
    url: ""
    secret: ""
    timeout_seconds: 8
    max_retries: 5
