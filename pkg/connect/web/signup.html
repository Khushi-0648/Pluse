<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect WhatsApp Business - Pulse</title>
  <link rel="stylesheet" href="/signup.css">
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#0d7a5f"/><path d="M22 46V18h12a9 9 0 0 1 0 18H22" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Connect WhatsApp Business</h1>
    </div>
    <p class="subtitle">Link your official WhatsApp Business account to Pulse with Meta Embedded Signup.</p>
    
    <div id="status-box" class="status-box hidden"></div>

    <div id="action-area">
      <button id="fb-btn" class="btn-fb" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Connect with Facebook
      </button>
      <p class="hint">A secure Meta popup will appear allowing you to select your WhatsApp Business Account and phone number.</p>
    </div>
  </div>

  <script>
    window.PULSE_CONFIG = {
      appId: "{{.AppID}}",
      configId: "{{.ConfigID}}",
      version: "{{.Version}}",
      state: "{{.State}}",
      nonce: "{{.Nonce}}",
      sdkUrl: "{{.SDK}}"
    };
  </script>
  <script src="/signup.js"></script>
</body>
</html>
