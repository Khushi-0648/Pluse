<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">

<button class="skip-link" type="button" data-action="skip-to-content">Skip to content</button>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Main">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">P</div>
      <div><div class="brand-name">{{.Product}}</div><div class="brand-sub">Messaging automation</div></div>
    </div>
    <a class="nav-link" href="#/home" data-nav="home"><svg class="icon"><use href="#i-home"/></svg>Home</a>
    <a class="nav-link" href="#/inbox" data-nav="inbox"><svg class="icon"><use href="#i-inbox"/></svg>Inbox<span class="badge" id="badge-inbox" hidden></span></a>
    <a class="nav-link" href="#/contacts" data-nav="contacts"><svg class="icon"><use href="#i-users"/></svg>Contacts</a>
    <div class="nav-group" id="nav-automation-label">Automation</div>
    <a class="nav-link" href="#/replies" data-nav="replies" data-admin><svg class="icon"><use href="#i-reply"/></svg>Auto-replies</a>
    <a class="nav-link" href="#/templates" data-nav="templates"><svg class="icon"><use href="#i-file"/></svg>Templates</a>
    <a class="nav-link" href="#/campaigns" data-nav="campaigns" data-admin><svg class="icon"><use href="#i-send"/></svg>Campaigns</a>
    <a class="nav-link" href="#/scheduled" data-nav="scheduled"><svg class="icon"><use href="#i-clock"/></svg>Scheduled</a>
    <a class="nav-link" href="#/reports" data-nav="reports" data-admin><svg class="icon"><use href="#i-chart"/></svg>Reports</a>
    <div class="nav-group">Setup</div>
    <a class="nav-link" href="#/settings" data-nav="settings" data-admin><svg class="icon"><use href="#i-settings"/></svg>Settings</a>
    <a class="nav-link" href="#/help" data-nav="help"><svg class="icon"><use href="#i-help"/></svg>Help and safety</a>
    <div class="sidebar-foot">
      <div id="whoami"></div>
      <button class="btn ghost small" type="button" data-action="logout"><svg class="icon icon-sm"><use href="#i-logout"/></svg>Sign out</button>
      <div>Version {{.Version}}</div>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="btn ghost icon-only menu-btn" type="button" data-action="toggle-menu" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
      <h1 id="page-title">Home</h1>
      <div class="spacer"></div>
      <span class="pill hide-sm" id="mode-pill" hidden></span>
      <span class="pill" id="conn-pill" role="status"><span class="dot"></span><span>Checking</span></span>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="bottom-nav" aria-label="Quick">
  <a href="#/home" data-nav="home"><svg class="icon"><use href="#i-home"/></svg>Home</a>
  <a href="#/inbox" data-nav="inbox"><svg class="icon"><use href="#i-inbox"/></svg>Inbox<span class="badge" id="badge-inbox-m" hidden></span></a>
  <a href="#/contacts" data-nav="contacts"><svg class="icon"><use href="#i-users"/></svg>Contacts</a>
  <a href="#/scheduled" data-nav="scheduled"><svg class="icon"><use href="#i-clock"/></svg>Scheduled</a>
  <button type="button" data-action="toggle-menu"><svg class="icon"><use href="#i-more"/></svg>More</button>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="savebar-root"></div>
</body>
</html>
